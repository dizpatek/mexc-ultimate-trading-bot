<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #e0e0e0;
            padding: 16px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #2962FF;
            margin-bottom: 4px;
        }
        
        .header .version {
            font-size: 10px;
            color: #666;
        }
        
        .status-card {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .status-label {
            font-size: 12px;
            color: #888;
        }
        
        .status-value {
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-value.logged-in {
            color: #10b981;
        }
        
        .status-value.logged-out {
            color: #f43f5e;
        }
        
        .account-info {
            background: rgba(41, 98, 255, 0.1);
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
        }
        
        .account-email {
            font-size: 11px;
            color: #2962FF;
            word-break: break-all;
        }
        
        .btn {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }
        
        .btn-primary {
            background: #2962FF;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1E53E5;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #e0e0e0;
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }
        
        .btn-danger {
            background: rgba(244, 63, 94, 0.2);
            color: #f43f5e;
        }
        
        .btn-danger:hover {
            background: rgba(244, 63, 94, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .divider {
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 12px 0;
        }
        
        .section-title {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .cookie-count {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            margin-bottom: 8px;
        }
        
        .cookie-icon {
            width: 16px;
            height: 16px;
            color: #fbbf24;
        }
        
        .cookie-text {
            font-size: 11px;
            color: #888;
        }
        
        .cookie-number {
            font-weight: 600;
            color: #fbbf24;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px;
        }
        
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #2962FF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .google-accounts {
            margin-top: 8px;
        }
        
        .google-account {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .google-account:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .google-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4285f4, #34a853);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: white;
        }
        
        .google-email {
            font-size: 11px;
            color: #e0e0e0;
            flex: 1;
        }
        
        .hidden {
            display: none;
        }
        
        .message {
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 8px;
        }
        
        .message-success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }
        
        .message-error {
            background: rgba(244, 63, 94, 0.1);
            color: #f43f5e;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 Matrix Pro Bridge</h1>
        <span class="version">v3.0 - Cookie Manager</span>
    </div>
    
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <span style="font-size: 12px;">Yükleniyor...</span>
    </div>
    
    <div id="content" class="hidden">
        <div class="status-card">
            <div class="status-row">
                <span class="status-label">TradingView Durumu:</span>
                <span id="tv-status" class="status-value">Kontrol ediliyor...</span>
            </div>
            <div id="account-info" class="account-info hidden">
                <span id="tv-email" class="account-email"></span>
            </div>
        </div>
        
        <div class="cookie-count">
            <svg class="cookie-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="8" cy="9" r="1" fill="currentColor"></circle>
                <circle cx="15" cy="8" r="1" fill="currentColor"></circle>
                <circle cx="10" cy="14" r="1" fill="currentColor"></circle>
                <circle cx="16" cy="13" r="1" fill="currentColor"></circle>
            </svg>
            <span class="cookie-text">TradingView Cookies: <span id="cookie-count" class="cookie-number">0</span></span>
        </div>
        
        <div class="divider"></div>
        
        <div class="section-title">Google Hesapları</div>
        <div id="google-accounts" class="google-accounts">
            <!-- Google accounts will be listed here -->
        </div>
        
        <div class="divider"></div>
        
        <button id="btn-login" class="btn btn-primary">
            🔑 TradingView'a Giriş Yap
        </button>
        
        <button id="btn-refresh" class="btn btn-secondary">
            🔄 Durumu Yenile
        </button>
        
        <button id="btn-clear" class="btn btn-danger">
            🗑️ Cookieleri Temizle
        </button>
    </div>
    
    <div id="message" class="message hidden"></div>

    <script src="popup.js"></script>
</body>
</html>

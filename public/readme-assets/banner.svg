<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0.2" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="400" fill="url(#bgGradient)" />
  
  <!-- Matrix Grid -->
  <g opacity="0.1">
    <path d="M0 40H800 M0 80H800 M0 120H800 M0 160H800 M0 200H800 M0 240H800 M0 280H800 M0 320H800 M0 360H800" stroke="#22d3ee" stroke-width="0.5"/>
    <path d="M40 0V400 M80 0V400 M120 0V400 M160 0V400 M200 0V400 M240 0V400 M280 0V400 M320 0V400 M360 0V400 M400 0V400 M440 0V400 M480 0V400 M520 0V400 M560 0V400 M600 0V400 M640 0V400 M680 0V400 M720 0V400 M760 0V400" stroke="#22d3ee" stroke-width="0.5"/>
  </g>

  <!-- Central Elements -->
  <circle cx="400" cy="200" r="120" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.3" filter="url(#glow)"/>
  <circle cx="400" cy="200" r="100" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5" stroke-dasharray="20 10"/>
  
  <!-- Logic Pathways -->
  <path d="M400 80V120 M400 280V320 M280 200H320 M480 200H520" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Text -->
  <text x="400" y="195" font-family="monospace" font-size="24" font-weight="900" fill="#22d3ee" text-anchor="middle" filter="url(#glow)">MATRIX ENGINE</text>
  <text x="400" y="225" font-family="monospace" font-size="32" font-weight="900" fill="#22d3ee" text-anchor="middle" filter="url(#glow)">V3.0</text>
  
  <!-- Bottom Accents -->
  <rect x="250" y="340" width="300" height="4" fill="url(#neonCyan)" filter="url(#glow)"/>
  <text x="400" y="370" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle" letter-spacing="4">TACTICAL OPS DASHBOARD</text>

</svg>
